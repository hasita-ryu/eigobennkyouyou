<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>歴史カード</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 48%, #e2e8f0 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .app {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 32px 62px rgba(15, 23, 42, 0.12);
      padding: 28px;
      border: 1px solid #e2e8f0;
    }

    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-tabs,
    .deck-switch,
    .direction-switch {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tab,
    .deck-tab,
    .direction-tab {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-tab.active,
    .deck-tab.active,
    .direction-tab.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .progress-memo {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .progress-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .progress-input {
      width: 64px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #0f172a;
      padding: 6px 8px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    .progress-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .progress-total {
      color: #64748b;
      font-weight: 600;
    }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.08;
      color: #111827;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 14px;
      color: #475569;
      max-width: 420px;
    }

    .status {
      font-size: 14px;
      color: #475569;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid #dbeafe;
      white-space: nowrap;
    }

    .main-card {
      perspective: 1400px;
    }

    .flashcard {
      width: 100%;
      min-height: 320px;
      border-radius: 28px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s ease;
      cursor: pointer;
      outline: none;
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.12);
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04), 0 16px 28px rgba(15, 23, 42, 0.08);
    }

    .card-front {
      background: #ffffff;
    }

    .card-back {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      transform: rotateY(180deg);
    }

    .card-label {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 18px;
      opacity: 0.85;
    }

    .card-text {
      font-size: 28px;
      line-height: 1.3;
      font-weight: 700;
      max-width: 88%;
      color: inherit;
    }

    .card-hint {
      margin-top: 24px;
      font-size: 13px;
      color: rgba(71, 85, 105, 0.8);
      max-width: 82%;
    }

    .controls {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 16px 28px rgba(37, 99, 235, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn-speech.is-speaking {
      background: #0f172a;
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.18);
    }

    .btn-speech:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }

    .like-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      border: 2px solid #fda4af;
      background: rgba(255, 255, 255, 0.98);
      color: #ef4444;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      pointer-events: auto;
    }

    .like-toggle:hover {
      transform: scale(1.04);
    }

    .like-toggle.liked {
      background: #fee2e2;
      border-color: #ef4444;
    }

    @media (max-width: 660px) {
      .app {
        padding: 22px;
      }

      .app-title {
        font-size: 22px;
      }

      .flashcard {
        min-height: 300px;
      }

      .card-text {
        font-size: 24px;
      }
    }

    @media (max-width: 520px) {
      .app {
        padding: 18px;
      }

      .card-text {
        font-size: 20px;
      }

      .controls {
        margin-top: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <div class="deck-switch" role="tablist" aria-label="デッキ切替">
          <button class="deck-tab active" data-deck="history" id="deck-history">歴史</button>
          <button class="deck-tab" data-deck="english" id="deck-english">英語</button>
        </div>
        <div class="filter-tabs" role="tablist" aria-label="カードの表示切替">
          <button class="filter-tab active" data-mode="all" id="filter-all">全部</button>
          <button class="filter-tab" data-mode="liked" id="filter-liked">いいねしたやつ</button>
        </div>
        <div class="direction-switch" role="tablist" aria-label="英語カードの出題方向">
          <button class="direction-tab active" data-direction="en-ja" type="button">英語 → 日本語</button>
          <button class="direction-tab" data-direction="ja-en" type="button">日本語 → 英語</button>
        </div>
        <div class="progress-memo" aria-label="進捗メモ">
          <label class="progress-item" for="progress-history">
            <span>歴史</span>
            <input class="progress-input" id="progress-history" type="number" min="0" max="33" inputmode="numeric" placeholder="0" aria-label="歴史の進捗番号" />
            <span class="progress-total">/ 33</span>
          </label>
          <label class="progress-item" for="progress-english">
            <span>英語</span>
            <input class="progress-input" id="progress-english" type="number" min="0" max="144" inputmode="numeric" placeholder="0" aria-label="英語の進捗番号" />
            <span class="progress-total">/ 144</span>
          </label>
        </div>
        <div>
          <div class="app-title" id="app-title">歴史カード</div>
          <div class="subtitle" id="subtitle">カードを押して裏返し、次のカードへ進みます</div>
        </div>
      </div>
      <div class="status">
        <span id="stat-count">1 / 33</span>
      </div>
    </header>

    <main class="main-card">
      <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="カードをめくる">
        <button class="like-toggle" id="like-toggle" type="button" aria-label="いいね" aria-pressed="false">♡</button>
        <div class="card-face card-front">
          <div class="card-label">Question</div>
          <div class="card-text" id="question-text"></div>
          <div class="card-hint">カードを押すと答えが見えます</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Answer</div>
          <div class="card-text" id="answer-text"></div>
          <div class="card-hint">もう一度押すと問題に戻ります</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="prev-btn">前のカード</button>
        <button class="btn-primary" id="next-btn">次のカード</button>
        <button class="btn-primary btn-speech" id="speech-toggle" type="button" aria-pressed="false">読み上げ開始</button>
      </div>
    </main>

    <script>

          { q: "make sure", a: "必ず～する、確認する" },
          { q: "work on", a: "取り組む" },
          { q: "traditional", a: "伝統的な" },
          { q: "instrument", a: "楽器；器具" },
          { q: "no matter what S V", a: "たとえ何が～しても" },
          { q: "Some~ Others ...", a: "～な人もいれば、...な人もいる" },
          { q: "provide", a: "提供する" },
          { q: "feast", a: "ごちそう、祝宴" },
          { q: "imitate", a: "まねる、模範とする" },
          { q: "landscape", a: "景観・景色" },
          { q: "leafy", a: "葉の多い、緑の多い" },
          { q: "bunch", a: "房・束" },
          { q: "out of ~", a: "～の中から、～から作り出して" },
          { q: "portrait", a: "肖像画" },
          { q: "after", a: "～にちなんで" },
          { q: "pea pod", a: "豆のさや" },
          { q: "eyelid", a: "まぶた" },
          { q: "billion", a: "10億" },
          { q: "mobile", a: "移動できる、携帯用の、携帯電話" },
          { q: "device", a: "機器、装置" },
          { q: "gadget", a: "道具、装置" },
          { q: "incredible", a: "信じられない、すごい" },
          { q: "search for ~", a: "～を探す" },
          { q: "look up", a: "調べる" },
          { q: "text", a: "テキストメッセージ、メッセージを送る" },
          { q: "typical", a: "典型的な、普通の" },
          { q: "spend time on ~", a: "～に時間を費やす" },
          { q: "let's see", a: "どうなるか見てみよう、ええと" },
          { q: "think outside the box", a: "既成概念にとらわれずに物事を考える" },
          { q: "remarkable", a: "卓越した、目立った" },
          { q: "take ~ for example", a: "～を例にとる" },
          { q: "fourteen-year-old", a: "14歳の" },
          { q: "suffer from ~", a: "～に苦しむ" },
          { q: "award-winning", a: "賞をとった" },
          { q: "allow O to do ~", a: "Oが～することを許可する、可能にする" },
          { q: "treat", a: "ご褒美、おやつ" },
          { q: "grateful", a: "感謝している" },
          { q: "be tired of ~", a: "～に飽きる" },
          { q: "come up with ~", a: "～を思いつく" },
          { q: "civilization", a: "文明" },
          { q: "archaeologist", a: "考古学者" },
          { q: "trade", a: "貿易、（動詞）取引する" },
          { q: "continue to do ~", a: "～し続ける" },
          { q: "site", a: "場所、遺跡" },
          { q: "track", a: "追跡する" },
          { q: "diet", a: "食事、食生活" },
          { q: "artifact", a: "遺物、工芸品" },
          { q: "skeleton", a: "骨格（全体）" },
          { q: "bury", a: "埋める、埋葬する" },
          { q: "Türkiye", a: "トルコ" },
          { q: "species", a: "種" },
          { q: "chore", a: "（家庭内の）雑用、家事" },
          { q: "complain", a: "不平を言う、苦情を言う" },
          { q: "throughout", a: "～の至る所で；～の間ずっと" },
          { q: "few", a: "ほとんどない、少ししかない" },
          { q: "present-day", a: "現代の、現在の" },
          { q: "as well", a: "～もまた；さらに" },
          { q: "rarely", a: "めったに～ない" },
          { q: "no longer", a: "もはや～ない" },
          { q: "instead", a: "その代わりに" },
          { q: "as little as ~", a: "～ほど少ない、たった～" },
          { q: "penny", a: "1ペニー硬貨；わずかなお金" },
          { q: "peer", a: "同年代の人、仲間" },
        ]
      };

      let currentIndex = 0;
      let flipped = false;
      let currentMode = "all";
      let currentDeck = "history";
      let englishDirection = "en-ja";
      const likedIndexes = {
        history: new Set(),
        english: new Set()
      };

      const flashcard = document.getElementById("flashcard");
      const questionText = document.getElementById("question-text");
      const answerText = document.getElementById("answer-text");
      const statCount = document.getElementById("stat-count");
      const nextBtn = document.getElementById("next-btn");
      const prevBtn = document.getElementById("prev-btn");
      const speechToggle = document.getElementById("speech-toggle");
      const likeToggle = document.getElementById("like-toggle");
      const filterTabs = document.querySelectorAll(".filter-tab");
      const deckTabs = document.querySelectorAll(".deck-tab");
      const directionTabs = document.querySelectorAll(".direction-tab");
      const appTitle = document.getElementById("app-title");
      const progressHistory = document.getElementById("progress-history");
      const progressEnglish = document.getElementById("progress-english");
      const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
      let speechPlaying = false;
      let speechRunId = 0;
      let englishVoice = null;
      let japaneseVoice = null;

      const progressInputs = {
        history: progressHistory,
        english: progressEnglish
      };

      function loadProgressMemo() {
        Object.entries(progressInputs).forEach(([deck, input]) => {
          const saved = localStorage.getItem(`flashcard-progress-${deck}`);
          if (saved !== null) {
            input.value = saved;
          }
        });
      }

      function loadEnglishDirection() {
        const saved = localStorage.getItem("flashcard-english-direction");
        if (saved === "en-ja" || saved === "ja-en") {
          englishDirection = saved;
        }

        directionTabs.forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.direction === englishDirection);
        });
      }

      function saveProgressMemo(deck) {
        const input = progressInputs[deck];
        let value = input.value.trim();

        if (value === "") {
          localStorage.removeItem(`flashcard-progress-${deck}`);
          return;
        }

        const max = decks[deck].length;
        const numericValue = Math.max(0, Math.min(max, Number(value)));
        input.value = Number.isFinite(numericValue) ? Math.trunc(numericValue) : "";

        if (input.value === "") {
          localStorage.removeItem(`flashcard-progress-${deck}`);
        } else {
          localStorage.setItem(`flashcard-progress-${deck}`, input.value);
        }
      }

      function getCurrentDeckCards() {
        return decks[currentDeck];
      }

      function getVisibleCards() {
        const deckCards = getCurrentDeckCards();
        if (currentMode === "liked") {
          return deckCards.filter((card, index) => likedIndexes[currentDeck].has(index));
        }
        return deckCards;
      }

      function getCardSides(card) {
        if (currentDeck === "english" && englishDirection === "ja-en") {
          return {
            question: card.a,
            answer: card.q,
          };
        }

        return {
          question: card.q,
          answer: card.a,
        };
      }

      function updateLikeButton() {
        const visibleCards = getVisibleCards();
        if (!visibleCards.length) {
          likeToggle.textContent = "♡";
          likeToggle.classList.remove("liked");
          likeToggle.setAttribute("aria-pressed", "false");
          return;
        }

        const card = visibleCards[currentIndex];
        const originalIndex = getCurrentDeckCards().indexOf(card);
        const isLiked = likedIndexes[currentDeck].has(originalIndex);
        likeToggle.textContent = isLiked ? "♥" : "♡";
        likeToggle.classList.toggle("liked", isLiked);
        likeToggle.setAttribute("aria-pressed", isLiked ? "true" : "false");
      }

      function renderCard(index) {
        const visibleCards = getVisibleCards();
        flashcard.style.transition = "none";
        setFlipped(false);
        void flashcard.offsetWidth;

        if (!visibleCards.length) {
          questionText.textContent = "いいねしたカードはまだありません";
          answerText.textContent = "";
          statCount.textContent = "0 / 0";
          currentIndex = 0;
          updateLikeButton();
          requestAnimationFrame(() => {
            flashcard.style.transition = "";
          });
          return;
        }

        currentIndex = Math.min(index, visibleCards.length - 1);
        const card = visibleCards[currentIndex];
        const sides = getCardSides(card);
        questionText.textContent = sides.question;
        answerText.textContent = sides.answer;
        statCount.textContent = `${currentIndex + 1} / ${visibleCards.length}`;
        appTitle.textContent = currentDeck === "history" ? "歴史カード" : "英語カード";
        updateLikeButton();

        requestAnimationFrame(() => {
          flashcard.style.transition = "";
        });
      }

      function setFlipped(value) {
        flipped = value;
        flashcard.classList.toggle("flipped", flipped);
      }

      function updateSpeechButton() {
        speechToggle.textContent = speechPlaying ? "読み上げ停止" : "読み上げ開始";
        speechToggle.classList.toggle("is-speaking", speechPlaying);
        speechToggle.setAttribute("aria-pressed", speechPlaying ? "true" : "false");
      }

      function delay(ms, runId) {
        return new Promise((resolve) => {
          window.setTimeout(() => {
            resolve(speechPlaying && runId === speechRunId);
          }, ms);
        });
      }

      function chooseVoice(voices, langPrefix, preferredNames) {
        const matchingVoices = voices.filter((voice) => voice.lang.toLowerCase().startsWith(langPrefix));
        if (!matchingVoices.length) {
          return null;
        }

        return preferredNames
          .map((name) => matchingVoices.find((voice) => voice.name.toLowerCase().includes(name)))
          .find(Boolean) || matchingVoices[0];
      }

      function refreshSpeechVoices() {
        if (!canSpeak) {
          return;
        }

        const voices = window.speechSynthesis.getVoices();
        englishVoice = chooseVoice(voices, "en", [
          "samantha",
          "alex",
          "daniel",
          "google us english",
          "google uk english",
          "microsoft",
        ]);
        japaneseVoice = chooseVoice(voices, "ja", [
          "kyoko",
          "otoya",
          "google 日本語",
          "microsoft nanami",
          "microsoft haruka",
        ]);
      }

      function waitForSpeechVoices() {
        return new Promise((resolve) => {
          refreshSpeechVoices();
          if (englishVoice || window.speechSynthesis.getVoices().length) {
            resolve();
            return;
          }

          const timeoutId = window.setTimeout(() => {
            refreshSpeechVoices();
            resolve();
          }, 1200);

          window.speechSynthesis.onvoiceschanged = () => {
            window.clearTimeout(timeoutId);
            refreshSpeechVoices();
            resolve();
          };
        });
      }

      function speakText(text, lang, runId) {
        return new Promise((resolve) => {
          if (!speechPlaying || runId !== speechRunId || !text) {
            resolve(false);
            return;
          }

          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = lang;
          if (lang.startsWith("en") && englishVoice) {
            utterance.voice = englishVoice;
          } else if (lang.startsWith("ja") && japaneseVoice) {
            utterance.voice = japaneseVoice;
          }
          utterance.rate = lang === "en-US" ? 0.82 : 0.92;
          utterance.pitch = 1;
          utterance.onend = () => resolve(speechPlaying && runId === speechRunId);
          utterance.onerror = () => resolve(speechPlaying && runId === speechRunId);
          window.speechSynthesis.speak(utterance);
        });
      }

      async function playSpeechLoop(runId) {
        while (speechPlaying && runId === speechRunId) {
          const visibleCards = getVisibleCards();
          if (!visibleCards.length) {
            stopSpeech();
            return;
          }

          currentIndex = currentIndex % visibleCards.length;
          renderCard(currentIndex);
          const card = visibleCards[currentIndex];

          if (!(await speakText(card.q, "en-US", runId))) return;
          if (!(await delay(750, runId))) return;
          setFlipped(true);
          if (!(await delay(250, runId))) return;
          if (!(await speakText(card.a, "ja-JP", runId))) return;
          if (!(await delay(850, runId))) return;

          const latestCards = getVisibleCards();
          if (!latestCards.length) {
            stopSpeech();
            return;
          }
          currentIndex = (currentIndex + 1) % latestCards.length;
        }
      }

      async function startSpeech() {
        if (!canSpeak || speechPlaying) {
          return;
        }

        if (currentDeck !== "english") {
          setDeck("english");
        }

        if (!getVisibleCards().length) {
          return;
        }

        speechPlaying = true;
        speechRunId += 1;
        window.speechSynthesis.cancel();
        updateSpeechButton();
        await waitForSpeechVoices();
        playSpeechLoop(speechRunId);
      }

      function stopSpeech() {
        if (!speechPlaying) {
          return;
        }

        speechPlaying = false;
        speechRunId += 1;
        window.speechSynthesis.cancel();
        updateSpeechButton();
      }

      function toggleSpeech() {
        if (speechPlaying) {
          stopSpeech();
        } else {
          startSpeech();
        }
      }

      function nextCard() {
        if (speechPlaying) {
          stopSpeech();
        }

        const visibleCards = getVisibleCards();
        if (!visibleCards.length) {
          return;
        }
        currentIndex = (currentIndex + 1) % visibleCards.length;
        renderCard(currentIndex);
      }

      function prevCard() {
        if (speechPlaying) {
          stopSpeech();
        }

        const visibleCards = getVisibleCards();
        if (!visibleCards.length) {
          return;
        }
        currentIndex = (currentIndex - 1 + visibleCards.length) % visibleCards.length;
        renderCard(currentIndex);
      }

      function setFilter(mode) {
        if (speechPlaying) {
          stopSpeech();
        }

        currentMode = mode;
        filterTabs.forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.mode === mode);
        });
        renderCard(0);
      }

      function setDeck(deck) {
        if (speechPlaying) {
          stopSpeech();
        }

        currentDeck = deck;
        deckTabs.forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.deck === deck);
        });
        renderCard(0);
      }

      function setEnglishDirection(direction) {
        if (speechPlaying) {
          stopSpeech();
        }

        englishDirection = direction;
        localStorage.setItem("flashcard-english-direction", direction);
        directionTabs.forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.direction === direction);
        });
        renderCard(currentIndex);
      }

      function toggleLikeCurrentCard() {
        if (speechPlaying) {
          stopSpeech();
        }

        const visibleCards = getVisibleCards();
        if (!visibleCards.length) {
          return;
        }

        const card = visibleCards[currentIndex];
        const originalIndex = getCurrentDeckCards().indexOf(card);
        if (likedIndexes[currentDeck].has(originalIndex)) {
          likedIndexes[currentDeck].delete(originalIndex);
        } else {
          likedIndexes[currentDeck].add(originalIndex);
        }

        if (currentMode === "liked") {
          const remainingCards = getVisibleCards();
          if (!remainingCards.length) {
            renderCard(0);
          } else {
            currentIndex = Math.min(currentIndex, remainingCards.length - 1);
            renderCard(currentIndex);
          }
        } else {
          renderCard(currentIndex);
        }
      }

      flashcard.addEventListener("click", (event) => {
        if (event.target.id === "like-toggle") {
          return;
        }
        setFlipped(!flipped);
      });

      flashcard.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          setFlipped(!flipped);
        }
      });

      prevBtn.addEventListener("click", prevCard);
      nextBtn.addEventListener("click", nextCard);
      speechToggle.addEventListener("click", toggleSpeech);
      likeToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleLikeCurrentCard();
      });

      filterTabs.forEach((tab) => {
        tab.addEventListener("click", () => setFilter(tab.dataset.mode));
      });

      deckTabs.forEach((tab) => {
        tab.addEventListener("click", () => setDeck(tab.dataset.deck));
      });

      directionTabs.forEach((tab) => {
        tab.addEventListener("click", () => setEnglishDirection(tab.dataset.direction));
      });

      Object.entries(progressInputs).forEach(([deck, input]) => {
        input.addEventListener("input", () => saveProgressMemo(deck));
        input.addEventListener("change", () => saveProgressMemo(deck));
      });

      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea, select")) {
          return;
        }

        if (e.key === "ArrowRight" || e.key === "Enter") {
          nextCard();
        } else if (e.key === "ArrowLeft") {
          prevCard();
        } else if (e.key === "Escape") {
          setFlipped(false);
        } else if (e.key === "1") {
          setDeck("history");
        } else if (e.key === "2") {
          setDeck("english");
        }
      });

      loadProgressMemo();
      loadEnglishDirection();
      if (!canSpeak) {
        speechToggle.textContent = "読み上げ非対応";
        speechToggle.disabled = true;
      } else {
        refreshSpeechVoices();
        window.speechSynthesis.onvoiceschanged = refreshSpeechVoices;
      }
      renderCard(currentIndex);
    </script>
  </div>
